name: package

# Cuts PlatformIO packages from upstream release assets. No hand repacking.
# Triggered manually with the epic-cc and/or epic-hal tag that should be
# wrapped. The mapping between package version and upstream tag lives in
# packages/versions.json (D-6), so a packaging-only bump does not need a
# new compiler or HAL release. Each job commits its own version write-back
# and CHANGELOG.md rollup straight to master (no branch protection here,
# see AGENTS.md), so the three files never drift the way they used to.

on:
  workflow_dispatch:
    inputs:
      epic_cc_version:
        description: "epic-cc tag to wrap, e.g. v0.0.3 (leave empty to skip the toolchain job)"
        required: false
        type: string
      package_version:
        description: "toolchain-epiccc package version override for packaging-only bumps (default: epic tag without v)"
        required: false
        type: string
      epic_hal_version:
        description: "epic-hal tag to wrap, e.g. v0.5.0 (leave empty to skip the framework job)"
        required: false
        type: string
      framework_package_version:
        description: "framework-epichal package version override for packaging-only bumps (default: hal tag without v)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  toolchain:
    runs-on: ubuntu-latest
    if: ${{ inputs.epic_cc_version != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Resolve versions
        id: ver
        run: |
          tag="${{ inputs.epic_cc_version }}"
          if [ -z "$tag" ]; then echo "epic_cc_version required"; exit 1; fi
          upstream_ver="${tag#v}"
          pkg_ver="${{ inputs.package_version }}"
          if [ -z "$pkg_ver" ]; then pkg_ver="$upstream_ver"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "upstream_ver=$upstream_ver" >> "$GITHUB_OUTPUT"
          echo "pkg_ver=$pkg_ver" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$tag upstream=$upstream_ver package=$pkg_ver"

      - name: Download epic-cc bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          upstream_ver="${{ steps.ver.outputs.upstream_ver }}"
          gh release download "$tag" --repo apojomovsky/epic-cc \
            --pattern "epic-cc-${upstream_ver}-x86_64-linux.zip" \
            --pattern "epic-cc-${upstream_ver}-x86_64-windows.zip"
          ls -lh epic-cc-*.zip

      - name: Build PlatformIO toolchain packages
        run: |
          upstream_ver="${{ steps.ver.outputs.upstream_ver }}"
          pkg_ver="${{ steps.ver.outputs.pkg_ver }}"
          mkdir -p dist
          python3 scripts/package_toolchain.py \
            --zip "epic-cc-${upstream_ver}-x86_64-linux.zip" \
            --system linux_x86_64 \
            --version "$pkg_ver" \
            --out "dist/toolchain-epiccc-linux_x86_64-${pkg_ver}.tar.gz"
          python3 scripts/package_toolchain.py \
            --zip "epic-cc-${upstream_ver}-x86_64-windows.zip" \
            --system windows_amd64 \
            --version "$pkg_ver" \
            --out "dist/toolchain-epiccc-windows_amd64-${pkg_ver}.tar.gz"
          ls -lh dist/

      - name: Smoke test from repacked packages
        run: |
          pkg_ver="${{ steps.ver.outputs.pkg_ver }}"
          tmp="$(mktemp -d)"
          tar -xzf "dist/toolchain-epiccc-linux_x86_64-${pkg_ver}.tar.gz" -C "$tmp"
          chmod +x "$tmp/epic-cc"
          chmod +x "$tmp/clang/bin/"* 2>/dev/null || true
          "$tmp/epic-cc" --version
          cat > "$tmp/min.c" <<'EOF'
          void main(void) {}
          EOF
          "$tmp/epic-cc" "$tmp/min.c" -o "$tmp/smoke.hex"
          test -s "$tmp/smoke.hex"
          echo "smoke passed: $tmp/smoke.hex $(wc -c < "$tmp/smoke.hex") bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-packages
          path: dist/*.tar.gz

      - name: Publish to this repo's releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg_ver="${{ steps.ver.outputs.pkg_ver }}"
          upstream_tag="${{ steps.ver.outputs.tag }}"
          tag="toolchain-epiccc-v${pkg_ver}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, uploading assets"
            gh release upload "$tag" dist/*.tar.gz --clobber
          else
            gh release create "$tag" dist/*.tar.gz \
              --title "toolchain-epiccc $pkg_ver (from epic-cc $upstream_tag)" \
              --notes "Built from https://github.com/apojomovsky/epic-cc/releases/tag/$upstream_tag"
          fi

      - name: Sync versions and roll up the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          upstream_ver="${{ steps.ver.outputs.upstream_ver }}"
          pkg_ver="${{ steps.ver.outputs.pkg_ver }}"
          upstream_tag="${{ steps.ver.outputs.tag }}"
          repo_tag="toolchain-epiccc-v${pkg_ver}"

          old_upstream_tag="$(python3 scripts/sync_versions.py \
            --package toolchain-epiccc \
            --pkg-version "$pkg_ver" \
            --upstream-tag "$upstream_tag" \
            --upstream-url-linux "https://github.com/apojomovsky/epic-cc/releases/download/${upstream_tag}/epic-cc-${upstream_ver}-x86_64-linux.zip" \
            --upstream-url-windows "https://github.com/apojomovsky/epic-cc/releases/download/${upstream_tag}/epic-cc-${upstream_ver}-x86_64-windows.zip" \
            --asset-name "toolchain-epiccc-linux_x86_64-${pkg_ver}.tar.gz" \
            | sed -n 's/^old_upstream_tag=//p')"

          # gh release create (above) already made the "$repo_tag" git tag on
          # the default branch. Fetch it and regenerate the full changelog
          # rather than --prepend: --prepend leaves the old "## [Unreleased]"
          # section duplicated below the newly inserted one, since it never
          # removes what it superseded.
          git fetch origin --tags --force
          git-cliff --config cliff.toml -o CHANGELOG.md

          if gh api "repos/apojomovsky/epic-cc/contents/CHANGELOG.md?ref=${upstream_tag}" \
               --jq '.content' > /tmp/upstream-changelog.b64 2>/tmp/gh-api.err; then
            base64 -d /tmp/upstream-changelog.b64 > /tmp/upstream-changelog.md
          else
            echo "no epic-cc CHANGELOG.md at ${upstream_tag} yet: $(cat /tmp/gh-api.err)"
            : > /tmp/upstream-changelog.md
          fi

          fallback_args=()
          if [ ! -s /tmp/upstream-changelog.md ] && [ -n "$old_upstream_tag" ]; then
            git clone --quiet --no-checkout https://github.com/apojomovsky/epic-cc.git /tmp/epic-cc-hist
            git -C /tmp/epic-cc-hist log --oneline "${old_upstream_tag}..${upstream_tag}" > /tmp/upstream-shortlog.txt || true
            fallback_args=(--fallback-log /tmp/upstream-shortlog.txt)
          fi

          old_tag_args=()
          if [ -n "$old_upstream_tag" ]; then
            old_tag_args=(--old-upstream-tag "$old_upstream_tag")
          fi

          python3 scripts/rollup_changelog.py \
            --changelog CHANGELOG.md \
            --repo-tag "$repo_tag" \
            --upstream-name epic-cc \
            --new-upstream-tag "$upstream_tag" \
            "${old_tag_args[@]}" \
            --upstream-changelog /tmp/upstream-changelog.md \
            "${fallback_args[@]}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/versions.json packages/toolchain-epiccc/package.json platform.json CHANGELOG.md
          git commit -m "chore(release): toolchain-epiccc v${pkg_ver}"
          git push origin HEAD:master

  framework:
    runs-on: ubuntu-latest
    if: ${{ inputs.epic_hal_version != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Resolve versions
        id: ver
        run: |
          tag="${{ inputs.epic_hal_version }}"
          if [ -z "$tag" ]; then echo "epic_hal_version required"; exit 1; fi
          upstream_ver="${tag#v}"
          pkg_ver="${{ inputs.framework_package_version }}"
          if [ -z "$pkg_ver" ]; then pkg_ver="$upstream_ver"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "upstream_ver=$upstream_ver" >> "$GITHUB_OUTPUT"
          echo "pkg_ver=$pkg_ver" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$tag upstream=$upstream_ver package=$pkg_ver"

      - name: Download epic-hal family bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          gh release download "$tag" --repo apojomovsky/epic-hal \
            --pattern "epic-hal-pic16f87xa-${tag}.tar.gz" \
            --pattern "epic-hal-pic16f88x-${tag}.tar.gz" \
            --pattern "epic-hal-pic18fxx5x-${tag}.tar.gz"
          ls -lh epic-hal-*.tar.gz

      - name: Checkout epic-hal for the manifest and epic-cc source slice
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          git clone --quiet --depth 1 --branch "$tag" \
            https://github.com/apojomovsky/epic-hal.git /tmp/epic-hal-src

      - name: Build PlatformIO framework package
        run: |
          pkg_ver="${{ steps.ver.outputs.pkg_ver }}"
          tag="${{ steps.ver.outputs.tag }}"
          mkdir -p dist
          python3 scripts/package_framework.py \
            --tar "epic-hal-pic16f87xa-${tag}.tar.gz" \
            --tar "epic-hal-pic16f88x-${tag}.tar.gz" \
            --tar "epic-hal-pic18fxx5x-${tag}.tar.gz" \
            --manifest /tmp/epic-hal-src/epic-common/manifest/modules.toml \
            --hal-repo /tmp/epic-hal-src \
            --version "$pkg_ver" \
            --out "dist/framework-epichal-${pkg_ver}.tar.gz"
          ls -lh dist/

      - name: Smoke test from repacked framework package
        run: |
          pkg_ver="${{ steps.ver.outputs.pkg_ver }}"
          tmp="$(mktemp -d)"
          tar -xzf "dist/framework-epichal-${pkg_ver}.tar.gz" -C "$tmp"
          python3 -m json.tool "$tmp/package.json" >/dev/null
          for fam in pic16f87xa pic16f88x pic18fxx5x; do
            test -d "$tmp/${fam}-hal" || { echo "missing ${fam}-hal dir"; exit 1; }
            test -f "$tmp/epic-hal-sources-${fam}.json" || { echo "missing epic-hal-sources-${fam}.json"; exit 1; }
          done
          echo "smoke passed: $(find "$tmp" -mindepth 1 -maxdepth 1 | wc -l) top-level entries"

      - uses: actions/upload-artifact@v4
        with:
          name: framework-packages
          path: dist/*.tar.gz

      - name: Publish to this repo's releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg_ver="${{ steps.ver.outputs.pkg_ver }}"
          upstream_tag="${{ steps.ver.outputs.tag }}"
          tag="framework-epichal-v${pkg_ver}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, uploading assets"
            gh release upload "$tag" dist/*.tar.gz --clobber
          else
            gh release create "$tag" dist/*.tar.gz \
              --title "framework-epichal $pkg_ver (from epic-hal $upstream_tag)" \
              --notes "Built from https://github.com/apojomovsky/epic-hal/releases/tag/$upstream_tag"
          fi

      - name: Sync versions and roll up the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg_ver="${{ steps.ver.outputs.pkg_ver }}"
          upstream_tag="${{ steps.ver.outputs.tag }}"
          repo_tag="framework-epichal-v${pkg_ver}"

          old_upstream_tag="$(python3 scripts/sync_versions.py \
            --package framework-epichal \
            --pkg-version "$pkg_ver" \
            --upstream-tag "$upstream_tag" \
            --asset-name "framework-epichal-${pkg_ver}.tar.gz" \
            | sed -n 's/^old_upstream_tag=//p')"

          # gh release create (above) already made the "$repo_tag" git tag on
          # the default branch. Fetch it and regenerate the full changelog
          # rather than --prepend: --prepend leaves the old "## [Unreleased]"
          # section duplicated below the newly inserted one, since it never
          # removes what it superseded.
          git fetch origin --tags --force
          git-cliff --config cliff.toml -o CHANGELOG.md

          if gh api "repos/apojomovsky/epic-hal/contents/CHANGELOG.md?ref=${upstream_tag}" \
               --jq '.content' > /tmp/upstream-changelog.b64 2>/tmp/gh-api.err; then
            base64 -d /tmp/upstream-changelog.b64 > /tmp/upstream-changelog.md
          else
            echo "no epic-hal CHANGELOG.md at ${upstream_tag} yet: $(cat /tmp/gh-api.err)"
            : > /tmp/upstream-changelog.md
          fi

          fallback_args=()
          if [ ! -s /tmp/upstream-changelog.md ] && [ -n "$old_upstream_tag" ]; then
            git clone --quiet --no-checkout https://github.com/apojomovsky/epic-hal.git /tmp/epic-hal-hist
            git -C /tmp/epic-hal-hist log --oneline "${old_upstream_tag}..${upstream_tag}" > /tmp/upstream-shortlog.txt || true
            fallback_args=(--fallback-log /tmp/upstream-shortlog.txt)
          fi

          old_tag_args=()
          if [ -n "$old_upstream_tag" ]; then
            old_tag_args=(--old-upstream-tag "$old_upstream_tag")
          fi

          python3 scripts/rollup_changelog.py \
            --changelog CHANGELOG.md \
            --repo-tag "$repo_tag" \
            --upstream-name epic-hal \
            --new-upstream-tag "$upstream_tag" \
            "${old_tag_args[@]}" \
            --upstream-changelog /tmp/upstream-changelog.md \
            "${fallback_args[@]}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/versions.json packages/framework-epichal/package.json platform.json CHANGELOG.md
          git commit -m "chore(release): framework-epichal v${pkg_ver}"
          git push origin HEAD:master
