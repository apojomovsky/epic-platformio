[env:epic8]
platform = apojomovsky/epic8
board = pic16f877a
; Debugging needs nothing more: `pio debug` starts epic-cc-gdbserver on
; this build and stock gdb connects to it. See docs/user/debugging.md.
; Optional: stop at a C line on launch instead of the reset vector:
; debug_init_break = thbreak main.c:32
